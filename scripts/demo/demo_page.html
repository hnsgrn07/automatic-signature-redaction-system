<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature Redaction Demo</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f22; --muted: #5d6168; --line: #dcd9d1;
    --ok: #1f7a3a; --ok-bg: #e5f3e8; --bad: #b3261e; --bad-bg: #fbe7e5; --accent: #1f5fa8; --anchor: #c87814;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { padding: 22px 32px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 24px; padding: 24px 32px 60px; max-width: 1600px; margin: 0 auto; }
  aside .card, main .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  aside h2, main h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .doc { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 9px 12px; margin: 0 0 6px;
         border: 1px solid var(--line); border-radius: 7px; background: #fff; font: inherit; cursor: pointer; }
  .doc:hover { border-color: var(--accent); }
  .doc.active { border-color: var(--accent); background: #eaf1fa; }
  .doc span { color: var(--muted); font-size: 14px; }
  #drop { margin-top: 14px; border: 2px dashed var(--line); border-radius: 10px; padding: 22px 12px; text-align: center;
          color: var(--muted); cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  .device { margin-top: 14px; font-size: 13px; color: var(--muted); }
  main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .intro { color: var(--muted); font-size: 19px; padding: 40px 10px; text-align: center; }
  #log { font: 15px/1.6 Consolas, "Cascadia Mono", monospace; margin: 0; padding: 0; list-style: none; }
  #log li { padding: 2px 0; animation: in .25s ease-out; }
  #log li b { display: inline-block; width: 58px; color: var(--muted); font-weight: 400; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 14px; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.info { background: #eaf1fa; color: var(--accent); }
  .title { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; }
  .title strong { font-size: 21px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat div { font-size: 26px; font-weight: 650; }
  .stat span { color: var(--muted); font-size: 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pair figure, .proof figure { margin: 0; }
  figure img { width: 100%; border: 1px solid var(--line); border-radius: 6px; display: block; background: #fff; }
  figcaption { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .legend { font-size: 15px; color: var(--muted); margin: 0 0 10px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border: 3px solid; border-radius: 2px; vertical-align: -2px; margin: 0 4px 0 12px; }
  .proof { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
  .proof:first-of-type { border-top: 0; }
  .proof h3 { font-size: 15px; margin: 0 0 6px; }
  .proof .verdict { font-weight: 650; margin-top: 6px; }
  .verdict.bad { color: var(--bad); } .verdict.ok { color: var(--ok); }
  .checks { margin: 0; padding-left: 20px; }
  .downloads a { margin-right: 18px; color: var(--accent); }
  .error { color: var(--bad); font-weight: 600; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } .pair, .proof { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Automatic Signature Redaction</h1>
  <p>Scanned Baguio City ordinances &rarr; DocTR anchors &rarr; OpenCV detection &rarr; permanent pixel redaction &rarr; verification</p>
</header>
<div class="wrap">
  <aside>
    <div class="card">
      <h2>Documents the system has never seen</h2>
      <div id="docs">Loading&hellip;</div>
      <div id="drop">Drop a PDF here<br><small>or click to choose</small></div>
      <input id="file" type="file" accept="application/pdf" hidden>
      <div class="device" id="device"></div>
    </div>
  </aside>
  <main id="main">
    <div class="card intro">Choose a document on the left to run the pipeline live.</div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let poll = null;

fetch('/api/docs').then(r => r.json()).then(d => {
  $('#device').textContent = `OCR on ${d.device.toUpperCase()} (${d.device_name}), model loaded`;
  $('#docs').innerHTML = d.docs.length ? d.docs.map(x =>
    `<button class="doc" data-name="${esc(x.name)}">${esc(x.name.replace('.pdf',''))}<span>${x.pages} p</span></button>`).join('')
    : '<p>No PDFs in demo\\unseen.</p>';
  document.querySelectorAll('.doc').forEach(b => b.onclick = () => {
    document.querySelectorAll('.doc').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    start(fetch('/api/run?name=' + encodeURIComponent(b.dataset.name), {method: 'POST'}), b.dataset.name);
  });
});

const drop = $('#drop');
drop.onclick = () => $('#file').click();
$('#file').onchange = e => e.target.files[0] && upload(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };
function upload(f) {
  start(fetch('/api/upload', {method: 'POST', headers: {'X-Filename': encodeURIComponent(f.name)}, body: f}), f.name);
}

function start(req, name) {
  clearInterval(poll);
  $('#main').innerHTML = `<div class="card"><div class="title"><strong>${esc(name)}</strong><span class="badge info" id="state">starting</span></div><ul id="log"></ul></div>`;
  req.then(r => r.json().then(j => ({ok: r.ok, j}))).then(({ok, j}) => {
    if (!ok) { $('#log').innerHTML = `<li class="error">${esc(j.error)}</li>`; $('#state').textContent = 'refused'; $('#state').className = 'badge bad'; return; }
    let shown = 0;
    poll = setInterval(() => fetch('/api/job/' + j.job).then(r => r.json()).then(s => {
      for (; shown < s.log.length; shown++) {
        const l = s.log[shown];
        $('#log').insertAdjacentHTML('beforeend', `<li><b>${l.t.toFixed(1)}s</b>${esc(l.msg)}</li>`);
      }
      $('#state').textContent = s.state === 'running' ? 'running' : s.state;
      if (s.state === 'done') { clearInterval(poll); render(s); }
      if (s.state === 'error') { clearInterval(poll); $('#state').className = 'badge bad'; }
    }), 250);
  });
}

function render(s) {
  const r = s.result, f = n => `/files/${s.id}/${n}`;
  $('#state').outerHTML = `<span class="badge info">${esc(r.provenance)}</span>` +
    (r.ok ? '<span class="badge ok">SAFE &mdash; verification passed</span>' : '<span class="badge bad">NOT SAFE &mdash; needs review</span>');
  const t = r.timings;
  const card = document.querySelector('#main .card');
  card.insertAdjacentHTML('beforeend', `<div class="stats">
    <div class="stat"><div>${r.signatures}</div><span>signatures found</span></div>
    <div class="stat"><div>${r.pages}</div><span>pages</span></div>
    <div class="stat"><div>${r.pipeline_s.toFixed(1)} s</div><span>total pipeline time</span></div>
    <div class="stat"><div>${t.ocr.toFixed(1)} s</div><span>OCR (GPU)</span></div>
    <div class="stat"><div>${(t.detect + t.ingest).toFixed(1)} s</div><span>ingest + detection</span></div>
    <div class="stat"><div>${(t.redact + t.verify).toFixed(1)} s</div><span>redact + verify</span></div></div>`);

  let html = '';
  for (const v of r.views) {
    html += `<div class="card"><h2>Page ${v.page}: what the system found</h2>
      <p class="legend"><i style="border-color:var(--anchor)"></i>anchor (printed label or name/title read by OCR)
      <i style="border-color:var(--ok)"></i>signature box</p>
      <div class="pair">
        <figure><img src="${f(v.found)}"><figcaption>Before, with anchors and detected signatures</figcaption></figure>
        <figure><img src="${f(v.after)}"><figcaption>After: the image stored in the redacted PDF</figcaption></figure>
      </div></div>`;
  }
  if (r.proof.length) {
    const rc = r.recoverable;
    html += `<div class="card"><h2>Is the signature really gone?</h2>
      <p class="legend">Same boxes, two methods. Every image stored inside each saved PDF is extracted (what any free tool such as
      <code>pdfimages</code> does), and the one closest to the original signature is shown.
      Recoverable from the file: usual method <b>${rc.naive}/${rc.total}</b>, this system <b>${rc.ours}/${rc.total}</b>.</p>`;
    for (const p of r.proof) {
      html += `<div class="proof">
        <figure><h3>Original (p${p.page}, #${p.sig})</h3><img src="${f(p.orig)}"></figure>
        <figure><h3>Usual PyMuPDF redaction: on screen</h3><img src="${f(p.screen)}"><figcaption>Looks redacted</figcaption></figure>
        <figure><h3>Usual PyMuPDF redaction: images in the file</h3><img src="${f(p.naive)}">
          <div class="verdict ${p.naive_recoverable ? 'bad' : 'ok'}">${p.naive_recoverable
            ? 'Signature recoverable' + (p.naive_hidden ? ': a hidden copy of the original scan is still inside the file' : '')
            : 'Not recoverable'}</div></figure>
        <figure><h3>This system: images in the file</h3><img src="${f(p.ours)}">
          <div class="verdict ${p.ours_recoverable ? 'bad' : 'ok'}">${p.ours_recoverable ? 'Signature recoverable'
            : 'Not recoverable: pixels destroyed, no other copy in the file'}</div></figure>
      </div>`;
    }
    html += '</div>';
  }
  const vs = r.verify || {};
  html += `<div class="card"><h2>Automatic verification of the output file</h2><ul class="checks">
    <li>Every redacted box is solid black in the stored image pixels (${vs.boxes ?? 0} box(es))</li>
    <li>Everything outside the boxes is unchanged (max mean grey difference ${(vs.outside_diff_max ?? 0).toFixed(2)})</li>
    <li>No leftover copy of an original scan: ${vs.fragment_probes ?? 0} unique fragments of the original images searched, none found</li>
    <li>Single file revision, same page count and page sizes</li>
    ${r.problems.length ? `<li class="error">${r.problems.map(esc).join('<br>')}</li>` : ''}
    </ul>
    <p class="downloads" style="margin-top:12px">
      <a href="${f(r.downloads.original)}" target="_blank">Original PDF (${r.sizes_kb.original} KB)</a>
      <a href="${f(r.downloads.redacted)}" target="_blank">Redacted PDF (${r.sizes_kb.redacted} KB)</a>
      <a href="${f(r.downloads.naive)}" target="_blank">Usual-method PDF (${r.sizes_kb.naive} KB)</a></p></div>`;
  $('#main').insertAdjacentHTML('beforeend', html);
}
</script>
</body>
</html>
